
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Угадай игрока CS2</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #10131c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px 15px;
}

.container {
  max-width: 900px;
  margin: auto;
}

h1 {
  color: #f5a623;
  font-size: clamp(28px, 5vw, 42px);
}

.subtitle {
  color: #aab2c0;
}

.panel {
  background: #1c2332;
  padding: 25px;
  border-radius: 18px;
  margin-top: 20px;
  border: 1px solid #343e52;
}

.nickname {
  font-size: clamp(32px, 7vw, 55px);
  color: #ffb52e;
  font-weight: bold;
  margin: 20px;
}

.players {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 25px;
}

.player {
  background: #293449;
  border: 3px solid transparent;
  border-radius: 15px;
  overflow: hidden;
  cursor: pointer;
  transition: .2s;
  color: white;
  padding: 0;
}

.player:hover {
  transform: translateY(-5px);
  border-color: #ffb52e;
}

.player img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  object-position: top center;
  display: block;
  background: #343e52;
}

.player span {
  display: block;
  padding: 15px;
  font-size: 19px;
  font-weight: bold;
}

.player.correct {
  border-color: #20d889;
}

.player.wrong {
  border-color: #ff4545;
}

button {
  background: #f5a623;
  color: #171717;
  padding: 14px 25px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin: 10px;
}

button:hover {
  background: #ffc45e;
}

.stats {
  display: flex;
  justify-content: space-around;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 18px;
}

#message {
  min-height: 30px;
  font-size: 20px;
  margin: 20px;
}

#result {
  display: none;
}

.hidden {
  display: none !important;
}

.small {
  color: #8995a8;
  font-size: 13px;
  margin-top: 25px;
}

@media(max-width: 550px) {
  .players {
    gap: 9px;
  }

  .player img {
    height: 210px;
  }

  .player span {
    font-size: 15px;
  }

  .panel {
    padding: 14px;
  }
}
</style>
</head>

<body>
<div class="container">

<h1>🎯 УГАДАЙ ИГРОКА CS2</h1>
<p class="subtitle">
  Насколько хорошо ты знаешь профессиональную сцену Counter-Strike 2?
</p>

<div class="panel" id="game">

  <div class="stats">
    <div>🏆 Очки: <b id="score">0</b></div>
    <div>📊 Вопрос: <b id="round">1/10</b></div>
    <div>🔥 Серия: <b id="streak">0</b></div>
  </div>

  <p>Кто из этих игроков имеет данный никнейм?</p>

  <div class="nickname" id="nickname">
    s1mple
  </div>

  <div class="players" id="players"></div>

  <div id="message"></div>

  <button id="next" class="hidden">
    Следующий вопрос →
  </button>

</div>

<div class="panel" id="result">

  <h2>🏆 ИГРА ОКОНЧЕНА!</h2>

  <h1 id="finalScore">0/10</h1>

  <p id="comment"></p>

  <button onclick="restart()">
    🔄 Играть заново
  </button>

</div>

<p class="small">
  CS2 PLAYER QUIZ • Угадай профессионала!
</p>

</div>

<script>
const playersData = [
  {
    name: "s1mple",
    image: "https://img-cdn.hltv.org/playerbodyshot/RGemStZHTfFk8AAjkJrbTR.png?bg=3e4c54&h=800&ixlib=java-2.1.0&rect=128%2C8%2C447%2C447&s=360406db3a8157004b45ed4ee0e7b7ba&w=800"
  },
  {
    name: "ZywOo",
    image: "https://img-cdn.hltv.org/playerbodyshot/FU6cX0sBXlqI-UGYm_92sq.png?bg=3e4c54&h=800&ixlib=java-2.1.0&rect=140%2C12%2C451%2C451&s=1b3adc6e09a751be04ebc0a51814c1fd&w=800"
  }
];

let score = 0;
let round = 0;
let streak = 0;
let currentPlayer = null;
let answered = false;
let questions = [];

const $ = id => document.getElementById(id);

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function createQuestions() {
  questions = [];

  for (let i = 0; i < 10; i++) {
    questions.push(
      playersData[i % playersData.length]
    );
  }

  questions = shuffle(questions);
}

function startGame() {
  score = 0;
  round = 0;
  streak = 0;

  $("score").textContent = score;
  $("streak").textContent = streak;

  $("game").style.display = "block";
  $("result").style.display = "none";

  createQuestions();
  nextQuestion();
}

function nextQuestion() {
  if (round >= 10) {
    finishGame();
    return;
  }

  answered = false;
  currentPlayer = questions[round];

  $("round").textContent = (round + 1) + "/10";
  $("nickname").textContent = currentPlayer.name;
  $("message").textContent = "";
  $("next").classList.add("hidden");

  const choices = shuffle(playersData);

  const container = $("players");
  container.innerHTML = "";

  choices.forEach(player => {
    const card = document.createElement("button");
    card.className = "player";

    const img = document.createElement("img");
    img.src = player.image;
    img.alt = "Игрок CS2";
    img.onerror = () => {
      img.alt = "Фото не загрузилось";
      img.src = "";
    };

    const name = document.createElement("span");
    name.textContent = "Игрок CS2";

    card.appendChild(img);
    card.appendChild(name);

    card.onclick = () => choosePlayer(player, card);

    container.appendChild(card);
  });
}

function choosePlayer(player, card) {
  if (answered) return;

  answered = true;

  if (player.name === currentPlayer.name) {
    score++;
    streak++;

    $("message").textContent = "✅ ПРАВИЛЬНО! Отлично!";
    $("message").style.color = "#20d889";
    card.classList.add("correct");
  } else {
    streak = 0;

    $("message").textContent =
      "❌ Неправильно! Это " + currentPlayer.name;

    $("message").style.color = "#ff5555";

    card.classList.add("wrong");
  }

  $("score").textContent = score;
  $("streak").textContent = streak;

  document.querySelectorAll(".player").forEach(button => {
    button.disabled = true;
  });

  $("next").textContent =
    round === 9 ? "Посмотреть результат" : "Следующий вопрос →";

  $("next").classList.remove("hidden");

  round++;
}

function finishGame() {
  $("game").style.display = "none";
  $("result").style.display = "block";

  $("finalScore").textContent = score + "/10";

  let comment = "";

  if (score === 10) {
    comment = "🔥 Легенда CS2! Ни одной ошибки!";
  } else if (score >= 8) {
    comment = "🏆 Отличный результат! Ты хорошо знаешь CS2!";
  } else if (score >= 5) {
    comment = "👍 Неплохо! Но есть куда расти!";
  } else {
    comment = "🎮 Пора смотреть больше турниров!";
  }

  $("comment").textContent = comment;
}

function restart() {
  startGame();
}

$("next").onclick = nextQuestion;

startGame();
</script>

</body>
</html>
