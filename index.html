
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ronaldo Video Maker</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 950px;
  margin: auto;
}
h1 {
  color: #ffca35;
  font-size: 36px;
}
canvas {
  width: 100%;
  border-radius: 15px;
  border: 2px solid #ffbd30;
  background: #101b25;
  margin-top: 20px;
}
button {
  background: #ffbd30;
  color: #111;
  border: 0;
  padding: 16px 25px;
  margin: 10px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 17px;
  cursor: pointer;
}
button:hover {
  background: #ffe078;
}
#status {
  color: #45e99b;
  font-size: 18px;
  margin: 15px;
}
.subtitle {
  color: #aab5c5;
}
</style>
</head>
<body>
<div class="container">

<h1>⚽ RONALDO VIDEO MAKER</h1>
<p class="subtitle">
Создай свой футбольный хайлайт!
</p>

<canvas id="video" width="1280" height="720"></canvas>

<div>
  <button onclick="createVideo()">
    🎬 СОЗДАТЬ ВИДЕО
  </button>
  <button onclick="preview()">
    ▶ ПРЕДПРОСМОТР
  </button>
</div>

<div id="status">Готов к созданию видео!</div>

<a id="download" style="display:none;color:#ffca35;font-size:20px">
  ⬇ Скачать видео
</a>

</div>

<script>
const canvas = document.getElementById("video");
const ctx = canvas.getContext("2d");

const W = 1280;
const H = 720;
const duration = 15;

let animationId;
let startTime = 0;
let recorder;

function background() {
  const gradient = ctx.createLinearGradient(0,0,W,H);
  gradient.addColorStop(0,"#061629");
  gradient.addColorStop(0.5,"#123b37");
  gradient.addColorStop(1,"#090d18");

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,W,H);

  // Световые полосы
  for(let i=0;i<12;i++) {
    ctx.fillStyle = "rgba(255,190,40,0.07)";
    ctx.fillRect(i*120,0,4,H);
  }

  // Футбольное поле
  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.lineWidth = 4;
  ctx.strokeRect(100,100,1080,520);

  ctx.beginPath();
  ctx.moveTo(640,100);
  ctx.lineTo(640,620);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(640,360,100,0,Math.PI*2);
  ctx.stroke();
}

function text(value,y,size,color,alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `900 ${size}px Arial`;
  ctx.shadowColor = color;
  ctx.shadowBlur = 25;
  ctx.fillStyle = color;
  ctx.fillText(value,W/2,y);
  ctx.restore();
}

function ball(x,y,rotation=0) {
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rotation);

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(0,0,35,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(0,0,12,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function particles(t) {
  for(let i=0;i<45;i++) {
    const x = (i*173+t*90)%W;
    const y = (i*97+t*35)%H;

    ctx.fillStyle = "rgba(255,195,55,0.6)";
    ctx.beginPath();
    ctx.arc(x,y,2+(i%4),0,Math.PI*2);
    ctx.fill();
  }
}

function draw(t) {
  background();
  particles(t);

  // Сцена 1
  if(t<3) {
    text("THE LEGEND",270,85,"#ffffff",
      Math.min(1,t));

    text("CRISTIANO",370,105,"#ffca35",
      Math.min(1,t));

    text("RONALDO",480,105,"#ffca35",
      Math.min(1,t));

    ball(
      640+Math.sin(t*4)*150,
      590,
      t*4
    );
  }

  // Сцена 2
  else if(t<7) {
    const p=(t-3)/4;

    text("CRISTIANO RONALDO",220,65,"#ffffff");

    text("PORTUGAL",340,45,"#ffca35");

    // Силуэт футболиста
    ctx.save();
    ctx.translate(640,450-p*90);

    ctx.fillStyle="#ffca35";
    ctx.beginPath();
    ctx.arc(0,-170,48,0,Math.PI*2);
    ctx.fill();

    ctx.fillRect(-65,-110,130,150);

    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=35;
    ctx.lineCap="round";

    ctx.beginPath();
    ctx.moveTo(-35,20);
    ctx.lineTo(-100,130);
    ctx.moveTo(35,20);
    ctx.lineTo(100,130);
    ctx.stroke();

    ctx.restore();

    text("NO LIMITS",630,65,"#ffffff");
  }

  // Сцена 3
  else if(t<11) {
    const p=(t-7)/4;

    text("SIUUUUUU!",300,115,"#ffca35",
      Math.min(1,p*3));

    ctx.save();
    ctx.translate(640,440);
    ctx.rotate(p*Math.PI*2);

    ctx.strokeStyle="#ffca35";
    ctx.lineWidth=12;
    ctx.beginPath();
    ctx.arc(0,0,130,0,Math.PI*2);
    ctx.stroke();

    ctx.restore();

    text("THE CHAMPION",590,55,"#ffffff");
  }

  // Финальная сцена
  else {
    const alpha=Math.min(1,(t-11)*2);

    text("CRISTIANO RONALDO",260,75,
      "#ffca35",alpha);

    text("THE GOAT",390,120,
      "#ffffff",alpha);

    text("LEGEND NEVER DIES",510,45,
      "#ffca35",alpha);

    ball(640,600, t*5);
  }

  // Таймер ролика
  ctx.fillStyle="rgba(255,255,255,0.7)";
  ctx.font="22px Arial";
  ctx.textAlign="right";
  ctx.fillText("RONALDO EDIT",1160,60);
}

function animate() {
  const t=(performance.now()-startTime)/1000;
  draw(t);

  if(t<duration) {
    animationId=requestAnimationFrame(animate);
  }
}

function preview() {
  cancelAnimationFrame(animationId);
  startTime=performance.now();
  animate();
  document.getElementById("status").textContent=
    "▶ Предпросмотр видео...";
}

async function createVideo() {
  if(!canvas.captureStream ||
     typeof MediaRecorder==="undefined") {
    alert("Твой браузер не поддерживает запись видео.");
    return;
  }

  cancelAnimationFrame(animationId);

  const stream=canvas.captureStream(30);

  let mime="video/webm;codecs=vp9";

  if(!MediaRecorder.isTypeSupported(mime)) {
    mime="video/webm";
  }

  recorder=new MediaRecorder(stream,{
    mimeType:mime
  });

  const chunks=[];

  recorder.ondataavailable=e=>{
    if(e.data.size>0) chunks.push(e.data);
  };

  recorder.onstop=()=>{
    const blob=new Blob(chunks,{
      type:"video/webm"
    });

    const url=URL.createObjectURL(blob);
    const link=document.getElementById("download");

    link.href=url;
    link.download="ronaldo-video.webm";
    link.style.display="inline-block";

    document.getElementById("status").textContent=
      "✅ Видео создано! Нажми «Скачать видео».";

    stream.getTracks().forEach(track=>track.stop());
  };

  document.getElementById("download").style.display="none";

  document.getElementById("status").textContent=
    "🎬 Создаём видео... Подожди 15 секунд.";

  recorder.start();

  startTime=performance.now();

  function recordFrame() {
    const t=(performance.now()-startTime)/1000;
    draw(t);

    if(t<duration) {
      animationId=requestAnimationFrame(recordFrame);
    } else {
      recorder.stop();
    }
  }

  recordFrame();
}

draw(0);
</script>
</body>
</html>
