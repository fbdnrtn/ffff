
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Угадай игрока CS2</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  background: #10131c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 950px;
  margin: auto;
}

h1 {
  color: #f5a623;
  font-size: clamp(28px, 5vw, 43px);
}

.subtitle { color: #aab2c0; }

.panel {
  background: #1c2332;
  padding: 25px;
  border-radius: 18px;
  margin-top: 20px;
  border: 1px solid #343e52;
}

.stats {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 15px;
  font-size: 18px;
}

.nickname {
  font-size: clamp(35px, 7vw, 60px);
  color: #ffb52e;
  font-weight: bold;
  margin: 25px 0;
}

.players {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.player {
  background: #293449;
  border: 3px solid transparent;
  border-radius: 15px;
  overflow: hidden;
  cursor: pointer;
  padding: 0;
  color: white;
  transition: .2s;
  min-width: 0;
}

.player:hover:not(:disabled) {
  transform: translateY(-5px);
  border-color: #ffb52e;
}

.player img {
  width: 100%;
  height: 330px;
  object-fit: cover;
  display: block;
  background: #343e52;
}

.player span {
  display: block;
  padding: 15px;
  font-size: 18px;
  font-weight: bold;
}

.player.correct {
  border-color: #20d889;
}

.player.wrong {
  border-color: #ff4545;
}

.player:disabled {
  cursor: default;
}

button.action {
  background: #f5a623;
  color: #171717;
  padding: 14px 25px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin: 12px;
}

button.action:hover {
  background: #ffc45e;
}

#message {
  min-height: 35px;
  font-size: 20px;
  margin: 20px 0;
}

.hidden { display: none !important; }

#result { display: none; }

.small {
  color: #8995a8;
  font-size: 13px;
  margin-top: 25px;
}

#progress {
  height: 9px;
  background: #343e52;
  border-radius: 20px;
  overflow: hidden;
  margin: 20px 0;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #f5a623;
  transition: width .3s;
}

@media(max-width: 550px) {
  body { padding: 10px; }
  .panel { padding: 13px; }
  .players { gap: 9px; }
  .player img { height: 210px; }
  .player span { font-size: 14px; }
}
</style>
</head>

<body>
<div class="container">

<h1>🎯 УГАДАЙ ИГРОКА CS2</h1>

<p class="subtitle">
Проверь, насколько хорошо ты знаешь профессиональную сцену Counter-Strike 2!
</p>

<div class="panel" id="game">

  <div class="stats">
    <div>🏆 Очки: <b id="score">0</b></div>
    <div>📊 Вопрос: <b id="round">1/20</b></div>
    <div>🔥 Серия: <b id="streak">0</b></div>
  </div>

  <div id="progress">
    <div id="progressBar"></div>
  </div>

  <p>Кто из этих игроков имеет данный никнейм?</p>

  <div class="nickname" id="nickname">s1mple</div>

  <div class="players" id="players"></div>

  <div id="message"></div>

  <button class="action hidden" id="next">
    Следующий вопрос →
  </button>

</div>

<div class="panel" id="result">

  <h2>🏆 ИГРА ОКОНЧЕНА!</h2>

  <h1 id="finalScore">0/20</h1>

  <p id="comment"></p>

  <button class="action" onclick="restart()">
    🔄 Играть заново
  </button>

</div>

<p class="small">
CS2 PLAYER QUIZ • 20 PROFESSIONAL PLAYERS
</p>

</div>

<script>

// ==================================
// БАЗА ИГРОКОВ — 20 ПРОФЕССИОНАЛОВ
// ==================================

const playersData = [

  {
    name: "s1mple",
    real: "Oleksandr Kostyliev"
  },
  {
    name: "ZywOo",
    real: "Mathieu Herbaut"
  },
  {
    name: "donk",
    real: "Danil Kryshkovets"
  },
  {
    name: "m0NESY",
    real: "Ilya Osipov"
  },
  {
    name: "ropz",
    real: "Robin Kool"
  },
  {
    name: "sh1ro",
    real: "Dmitry Sokolov"
  },
  {
    name: "NiKo",
    real: "Nikola Kovac"
  },
  {
    name: "frozen",
    real: "David Cernansky"
  },
  {
    name: "b1t",
    real: "Valeriy Vakhovskiy"
  },
  {
    name: "Twistzz",
    real: "Russel Van Dulken"
  },
  {
    name: "XANTARES",
    real: "Ismailcan Dortkardes"
  },
  {
    name: "YEKINDAR",
    real: "Mareks Galinskis"
  },
  {
    name: "KSCERATO",
    real: "Kaike Cerato"
  },
  {
    name: "Spinx",
    real: "Lotan Giladi"
  },
  {
    name: "flameZ",
    real: "Shahar Shushan"
  },
  {
    name: "molodoy",
    real: "Danil Golubenko"
  },
  {
    name: "mezii",
    real: "William Merriman"
  },
  {
    name: "Senzu",
    real: "Azbayar Munkhbold"
  },
  {
    name: "xertioN",
    real: "Dorian Berman"
  },
  {
    name: "torzsi",
    real: "Adam Torzsas"
  }

];

// ==================================
// НАСТРОЙКИ ИГРЫ
// ==================================

const TOTAL = 20;

let score = 0;
let round = 0;
let streak = 0;
let questions = [];
let currentPlayer = null;
let answered = false;

const imageCache = {};

const $ = id => document.getElementById(id);

// ==================================
// ПЕРЕМЕШИВАНИЕ
// ==================================

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [result[i], result[j]] =
      [result[j], result[i]];
  }

  return result;
}

// ==================================
// ПОИСК ФОТОГРАФИЙ
// Wikimedia Commons
// ==================================

async function getPhoto(player) {

  if (imageCache[player.name] !== undefined) {
    return imageCache[player.name];
  }

  try {

    const query = encodeURIComponent(
      '"' + player.real + '" Counter-Strike'
    );

    const url =
      "https://commons.wikimedia.org/w/api.php" +
      "?action=query" +
      "&generator=search" +
      "&gsrsearch=" + query +
      "&gsrnamespace=6" +
      "&gsrlimit=8" +
      "&prop=imageinfo" +
      "&iiprop=url" +
      "&iiurlwidth=600" +
      "&format=json" +
      "&origin=*";

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Ошибка загрузки фотографии");
    }

    const data = await response.json();

    const pages = Object.values(
      data.query?.pages || {}
    );

    const valid = pages.find(page => {
      const title = (page.title || "").toLowerCase();

      return (
        title.includes("counter") ||
        title.includes(player.name.toLowerCase()) ||
        title.includes(player.real.split(" ")[0].toLowerCase())
      ) && page.imageinfo?.[0]?.thumburl;
    });

    const image =
      valid?.imageinfo?.[0]?.thumburl || null;

    imageCache[player.name] = image;

    return image;

  } catch (error) {

    console.warn(
      "Не удалось загрузить фото:",
      player.name,
      error
    );

    imageCache[player.name] = null;

    return null;
  }
}

// ==================================
// ЗАГРУЗКА ИЗОБРАЖЕНИЯ В КАРТОЧКУ
// ==================================

function makeFallback(player) {

  const initials = player.name
    .replace(/[^a-zA-Z0-9]/g, "")
    .slice(0, 3);

  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="600" height="500">
      <rect width="100%" height="100%"
            fill="#263449"/>
      <circle cx="300" cy="190" r="95"
              fill="#f5a623" opacity=".2"/>
      <text x="50%" y="45%"
            text-anchor="middle"
            font-size="85"
            font-family="Arial"
            font-weight="bold"
            fill="#f5a623">${initials}</text>
      <text x="50%" y="75%"
            text-anchor="middle"
            font-size="27"
            font-family="Arial"
            fill="white">CS2 PLAYER</text>
    </svg>
  `;

  return "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(svg);
}

async function loadImage(player, img, questionId) {

  const photo = await getPhoto(player);

  if (questionId !== round - 1) return;

  img.src = photo || makeFallback(player);

  img.onerror = () => {
    img.src = makeFallback(player);
  };
}

// ==================================
// НАЧАЛО ИГРЫ
// ==================================

function startGame() {

  score = 0;
  round = 0;
  streak = 0;

  $("score").textContent = 0;
  $("streak").textContent = 0;

  $("game").style.display = "block";
  $("result").style.display = "none";

  questions = shuffle(playersData);

  nextQuestion();
}

// ==================================
// НОВЫЙ ВОПРОС
// ==================================

function nextQuestion() {

  if (round >= TOTAL) {
    finishGame();
    return;
  }

  answered = false;

  currentPlayer = questions[round];

  const questionId = round;

  $("round").textContent =
    (round + 1) + "/" + TOTAL;

  $("nickname").textContent =
    currentPlayer.name;

  $("message").textContent = "";

  $("next").classList.add("hidden");

  $("progressBar").style.width =
    (round / TOTAL * 100) + "%";

  const opponent = shuffle(
    playersData.filter(
      player => player.name !== currentPlayer.name
    )
  )[0];

  const choices = shuffle([
    currentPlayer,
    opponent
  ]);

  const container = $("players");

  container.innerHTML = "";

  choices.forEach(player => {

    const card = document.createElement("button");

    card.className = "player";

    const img = document.createElement("img");

    img.alt = "Фото игрока " + player.name;

    img.src = makeFallback(player);

    const name = document.createElement("span");

    name.textContent = "Игрок CS2";

    card.appendChild(img);
    card.appendChild(name);

    card.onclick = () => {
      choosePlayer(player, card);
    };

    container.appendChild(card);

    loadImage(player, img, questionId);

  });

  round++;
}

// ==================================
// ВЫБОР ОТВЕТА
// ==================================

function choosePlayer(player, card) {

  if (answered) return;

  answered = true;

  const cards = document.querySelectorAll(".player");

  cards.forEach(button => {
    button.disabled = true;
  });

  if (player.name === currentPlayer.name) {

    score++;
    streak++;

    $("message").textContent =
      "✅ ПРАВИЛЬНО! Отлично!";

    $("message").style.color = "#20d889";

    card.classList.add("correct");

  } else {

    streak = 0;

    $("message").textContent =
      "❌ Неправильно! Это " +
      currentPlayer.name;

    $("message").style.color = "#ff5555";

    card.classList.add("wrong");

    cards.forEach(button => {
      if (
        button.querySelector("img").alt.includes(
          currentPlayer.name
        )
      ) {
        button.classList.add("correct");
      }
    });

  }

  $("score").textContent = score;

  $("streak").textContent = streak;

  $("progressBar").style.width =
    (round / TOTAL * 100) + "%";

  cards.forEach(button => {
    const img = button.querySelector("img");

    const found = playersData.find(
      p => img.alt === "Фото игрока " + p.name
    );

    if (found) {
      button.querySelector("span").textContent =
        found.name;
    }
  });

  $("next").textContent =
    round === TOTAL
      ? "Посмотреть результат"
      : "Следующий вопрос →";

  $("next").classList.remove("hidden");
}

// ==================================
// ЗАВЕРШЕНИЕ ИГРЫ
// ==================================

function finishGame() {

  $("game").style.display = "none";

  $("result").style.display = "block";

  $("finalScore").textContent =
    score + "/" + TOTAL;

  let comment = "";

  if (score === 20) {

    comment = "🔥 ЛЕГЕНДА CS2! 20 ИЗ 20!";

  } else if (score >= 17) {

    comment = "🏆 Невероятно! Ты настоящий эксперт!";

  } else if (score >= 14) {

    comment = "🔥 Отличный результат!";

  } else if (score >= 10) {

    comment = "👍 Хорошо! Ты знаешь профессионалов!";

  } else if (score >= 5) {

    comment = "🎮 Неплохо, но есть куда расти!";

  } else {

    comment = "💪 Пора смотреть больше турниров CS2!";

  }

  $("comment").textContent = comment;

  $("progressBar").style.width = "100%";
}

// ==================================
// ПОВТОРНАЯ ИГРА
// ==================================

function restart() {
  startGame();
}

// ==================================
// КНОПКА СЛЕДУЮЩЕГО ВОПРОСА
// ==================================

$("next").onclick = nextQuestion;

// ==================================
// ЗАПУСК
// ==================================

startGame();

</script>
</body>
</html>
